name: snapshot

on:
  schedule:
    - cron: "0 0 * * 1" # every Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot
        env:
          # The default GITHUB_TOKEN is limited to 1,000 requests/hour -> a PAT (secrets.LFARC_TOKEN, public read-only) with 5,000/hour is recommended
          GITHUB_TOKEN: ${{ secrets.LFARC_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name "lfarc-bot"
          git config user.email "lfarc-bot@users.noreply.github.com"
          git add data README.md
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%F)"
          git push
